[project]
name = "handson-agent"
version = "0.1.0"
description = "AgentCore ハンズオンで使う Strands Agent の雛形"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.0.0",
    "bedrock-agentcore>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
